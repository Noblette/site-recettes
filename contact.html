<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Site de recettes</title>
    <link rel="stylesheet" href="assets/css/contact.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!--barre de navigation-->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="recipes.html">Recettes</a></li>
                <li><a href="about.html">A propos</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!--Contenu principal : Formulaire de contact-->
    <main>
        <section class="contact-section">
            <h1>Contactez-nous</h1>
            <p>Une suggestion de recette ? Une question ? Laissez-nous un message !</p>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Nom / Pseudo :</label>
                    <input type="text" id="name" name="name" required placeholder="Votre nom ou pseudo">

                </div>
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required placeholder="Votre adresse email">
                </div>
                <div class="form-group">
                    <label for="message">Message :</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Votre message"></textarea>
                </div>
                <button type="submit" class="submit-btn">Envoyer le message</button>
            </form>
        </section>
    </main>
                
    </body>
    </html>
